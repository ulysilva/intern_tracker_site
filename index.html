function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function decrypt(pw){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},km,
    {name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c));
  return new TextDecoder().decode(pt);
}
async function unlock(pw,remember){
  var text;
  try{ text=await decrypt(pw); }
  catch(e){ document.getElementById("msg").textContent="Wrong passphrase."; try{localStorage.removeItem("rk")}catch(x){} return false; }
  if(remember){ try{localStorage.setItem("rk",pw)}catch(x){} }
  document.open(); document.write(text); document.close(); return true;
}
